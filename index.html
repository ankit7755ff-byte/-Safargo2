<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" name="viewport"/>
<title>Shri Krishna & Sudarshan Chakra - Sheshnag Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #06101e; font-family: 'Baloo 2', sans-serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
  .panel { background: rgba(6, 16, 30, 0.8); border: 2px solid #ffd700; border-radius: 14px; padding: 10px 16px; color: #fff; width: fit-content; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
  .title { font-family: 'Lilita One', cursive; font-size: 20px; color: #ffd700; text-shadow: 0 0 8px #ff9900; }
  .stats { font-size: 14px; font-weight: 800; color: #e2e8f0; margin-top: 4px; }
  .stats span { color: #38bdf8; }
  #banner { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); font-family: 'Lilita One', cursive; font-size: 38px; color: #ffd700; text-shadow: 0 0 16px #ff4500, 0 3px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.4s; z-index: 20; text-align: center; }
  #controls-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fde047; font-weight: 800; background: rgba(0,0,0,0.65); padding: 8px 18px; border-radius: 20px; border: 1px solid #ffd700; pointer-events: none; text-align: center; font-size: 14px; }
  #chakra-btn { position: fixed; right: 24px; bottom: 24px; width: 85px; height: 85px; border-radius: 50%; background: radial-gradient(circle, #fde047, #b45309); border: 3px solid #fff; color: #000; font-family: 'Lilita One', cursive; font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; pointer-events: auto; box-shadow: 0 0 20px #eab308; z-index: 30; }
  #chakra-btn:active { transform: scale(0.92); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="panel">
    <div class="title">॥ श्री कृष्ण लीला : कालिया दमन ॥</div>
    <div class="stats">Dusht Saanp Vadh: <span id="kill-count">0</span> | Asura Bachhe: <span id="alive-count">10</span></div>
  </div>
</div>
<div id="banner">सुदर्शन चक्र प्रहार!</div>
<div id="controls-hint">Mouse / Touch se disha dein | Space ya Chakra Button se Sudarshan Chakra chhoden!</div>
<div id="chakra-btn">CHAKRA<br/>ATTACK</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.min.js';
const AudioSys = {
  ctx: null,
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  playChakra() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(520, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.35);
    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.36);
  },
  playVadh() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.35, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  }
};
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#030b17');
scene.fog = new THREE.Fog('#030b17', 40, 110);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 200);
const hemi = new THREE.HemisphereLight('#67e8f9', '#1e293b', 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fef08a', 2.0);
sun.position.set(30, 50, 20);
sun.castShadow = true;
scene.add(sun);
const groundGeo = new THREE.PlaneGeometry(240, 240, 32, 32).rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshStandardMaterial({ color: '#092540', roughness: 0.15, metalness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);
function createKrishnaOnSheshnag() {
  const root = new THREE.Group();
  const coilMat = new THREE.MeshStandardMaterial({ color: '#041d1a', roughness: 0.3, metalness: 0.4 });
  const baseCoil = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.5, 12, 32).rotateX(Math.PI / 2), coilMat);
  baseCoil.position.y = 0.4;
  baseCoil.castShadow = true;
  root.add(baseCoil);
  const hoodMat = new THREE.MeshStandardMaterial({ color: '#064e3b', roughness: 0.35, metalness: 0.5 });
  const eyeMat = new THREE.MeshBasicMaterial({ color: '#ef4444' });
  for (let i = -2; i <= 2; i++) {
    const hoodGroup = new THREE.Group();
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 2.2, 8), hoodMat);
    neck.position.set(0, 1.1, -0.2);
    hoodGroup.add(neck);
    const hoodShape = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12).scale(1.2, 1.6, 0.3), hoodMat);
    hoodShape.position.set(0, 2.0, -0.3);
    hoodGroup.add(hoodShape);
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), eyeMat);
    e1.position.set(-0.2, 2.15, -0.15);
    const e2 = e1.clone();
    e2.position.set(0.2, 2.15, -0.15);
    hoodGroup.add(e1, e2);
    hoodGroup.rotation.y = (i * 0.28);
    hoodGroup.position.set(i * 0.45, 0, -0.6 - Math.abs(i) * 0.15);
    root.add(hoodGroup);
  }
  const krishnaGroup = new THREE.Group();
  krishnaGroup.position.set(0, 0.8, 0.1);
  const skinMat = new THREE.MeshStandardMaterial({ color: '#1d4ed8', roughness: 0.4, emissive: '#075985', emissiveIntensity: 0.4 });
  const pitambarMat = new THREE.MeshStandardMaterial({ color: '#facc15', roughness: 0.4 });
  const goldMat = new THREE.MeshStandardMaterial({ color: '#ffd700', metalness: 0.9, roughness: 0.2 });
  const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.8, 0.5, 12), pitambarMat);
  legs.position.y = 0.25;
  krishnaGroup.add(legs);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.26, 0.9, 10), skinMat);
  torso.position.y = 0.85;
  torso.castShadow = true;
  krishnaGroup.add(torso);
  const sash = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.08, 6, 16), pitambarMat);
  sash.rotation.x = Math.PI / 3;
  sash.position.y = 0.9;
  krishnaGroup.add(sash);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 14, 14), skinMat);
  head.position.y = 1.48;
  krishnaGroup.add(head);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.45, 10), goldMat);
  crown.position.y = 1.8;
  krishnaGroup.add(crown);
  const featherMat = new THREE.MeshBasicMaterial({ color: '#06b6d4' });
  const feather = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.35, 0.12), featherMat);
  feather.position.set(0, 1.95, -0.06);
  feather.rotation.z = 0.2;
  krishnaGroup.add(feather);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.65, 8), skinMat);
  arm.position.set(0.42, 1.15, 0.2);
  arm.rotation.z = -Math.PI / 4;
  arm.rotation.x = -Math.PI / 4;
  krishnaGroup.add(arm);
  const finger = new THREE.Object3D();
  finger.position.set(0.7, 1.4, 0.4);
  krishnaGroup.add(finger);
  root.add(krishnaGroup);
  scene.add(root);
  return { root, finger };
}
function createSudarshanChakra() {
  const chakra = new THREE.Group();
  const gold = new THREE.MeshStandardMaterial({ color: '#fde047', metalness: 0.95, roughness: 0.1, emissive: '#ea580c', emissiveIntensity: 0.8 });
  const gem = new THREE.MeshBasicMaterial({ color: '#38bdf8' });
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.06, 16), gold);
  chakra.add(core);
  const centerGem = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), gem);
  chakra.add(centerGem);
  for (let i = 0; i < 12; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), gold);
    const ang = (i / 12) * Math.PI * 2;
    blade.position.set(Math.cos(ang) * 0.7, 0, Math.sin(ang) * 0.7);
    blade.rotation.y = -ang;
    blade.rotation.z = -Math.PI / 2;
    chakra.add(blade);
  }
  const light = new THREE.PointLight('#fde047', 2, 10);
  chakra.add(light);
  scene.add(chakra);
  return chakra;
}
class AsuraSnake {
  constructor(x, z) {
    this.mesh = new THREE.Group();
    this.alive = true;
    this.speed = 4.2 + Math.random() * 2.2;
    this.angle = Math.random() * Math.PI * 2;
    const skinMat = new THREE.MeshStandardMaterial({ color: '#991b1b', roughness: 0.5 });
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.2, 8).rotateX(Math.PI / 2), skinMat);
    head.position.y = 0.4;
    this.mesh.add(head);
    const eyeMat = new THREE.MeshBasicMaterial({ color: '#4ade80' });
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), eyeMat);
    e1.position.set(-0.2, 0.6, 0.2);
    const e2 = e1.clone();
    e2.position.set(0.2, 0.6, 0.2);
    this.mesh.add(e1, e2);
    this.mesh.position.set(x, 0, z);
    scene.add(this.mesh);
  }
  update(dt, targetPos) {
    if (!this.alive) return;
    const dir = new THREE.Vector3().subVectors(targetPos, this.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    dir.normalize();
    this.mesh.position.addScaledVector(dir, this.speed * dt);
    this.mesh.rotation.y = Math.atan2(dir.x, dir.z);
    this.mesh.position.x += Math.sin(Date.now() * 0.008 + this.mesh.position.z) * 0.04;
  }
  destroy() {
    this.alive = false;
    scene.remove(this.mesh);
  }
}
const playerHero = createKrishnaOnSheshnag();
const chakraMesh = createSudarshanChakra();
let kills = 0;
let enemies = [];
const chakraState = { active: false, pos: new THREE.Vector3(), targetEnemy: null, returnSpeed: 38.0, flySpeed: 42.0 };
function spawnEnemies(count = 10) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = 35 + Math.random() * 35;
    enemies.push(new AsuraSnake(Math.cos(ang) * r, Math.sin(ang) * r));
  }
}
spawnEnemies(12);
function launchSudarshanChakra() {
  AudioSys.init();
  if (chakraState.active) return;
  let nearest = null;
  let minD = Infinity;
  for (const enemy of enemies) {
    if (enemy.alive) {
      const d = enemy.mesh.position.distanceTo(playerHero.root.position);
      if (d < minD) { minD = d; nearest = enemy; }
    }
  }
  if (nearest) {
    chakraState.active = true;
    chakraState.targetEnemy = nearest;
    AudioSys.playChakra();
    showBanner("॥ सुदर्शन चक्राय नमः ॥");
  }
}
function showBanner(txt) {
  const el = document.getElementById('banner');
  el.textContent = txt;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 1200);
}
const playerPos = playerHero.root.position;
const moveDir = { x: 0, z: 0 };
window.addEventListener('keydown', (e) => {
  AudioSys.init();
  if (e.code === 'Space' || e.code === 'KeyF') launchSudarshanChakra();
  if (e.code === 'KeyW' || e.code === 'ArrowUp') moveDir.z = -1;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') moveDir.z = 1;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveDir.x = -1;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') moveDir.x = 1;
});
window.addEventListener('keyup', (e) => {
  if (['KeyW', 'KeyS', 'ArrowUp', 'ArrowDown'].includes(e.code)) moveDir.z = 0;
  if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(e.code)) moveDir.x = 0;
});
document.getElementById('chakra-btn').addEventListener('click', launchSudarshanChakra);
window.addEventListener('pointerdown', (e) => {
  if (e.target.id !== 'chakra-btn') launchSudarshanChakra();
});
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  playerPos.x += moveDir.x * 12.0 * dt;
  playerPos.z += moveDir.z * 12.0 * dt;
  const fingerWorldPos = new THREE.Vector3();
  playerHero.finger.getWorldPosition(fingerWorldPos);
  chakraMesh.rotation.y += dt * 32.0;
  if (!chakraState.active) {
    chakraMesh.position.copy(fingerWorldPos);
    chakraMesh.position.y += 0.25;
    for (const enemy of enemies) {
      if (enemy.alive && enemy.mesh.position.distanceTo(playerPos) < 7.5) {
        launchSudarshanChakra();
        break;
      }
    }
  } else {
    if (chakraState.targetEnemy && chakraState.targetEnemy.alive) {
      const ePos = chakraState.targetEnemy.mesh.position.clone();
      ePos.y = 0.5;
      const toEnemy = new THREE.Vector3().subVectors(ePos, chakraMesh.position);
      const dist = toEnemy.length();
      if (dist < 1.2) {
        chakraState.targetEnemy.destroy();
        AudioSys.playVadh();
        kills++;
        document.getElementById('kill-count').textContent = kills;
        let nextTarget = null;
        let nd = Infinity;
        for (const en of enemies) {
          if (en.alive) {
            const d = en.mesh.position.distanceTo(chakraMesh.position);
            if (d < nd) { nd = d; nextTarget = en; }
          }
        }
        chakraState.targetEnemy = nextTarget;
      } else {
        toEnemy.normalize();
        chakraMesh.position.addScaledVector(toEnemy, chakraState.flySpeed * dt);
      }
    } else {
      const toFinger = new THREE.Vector3().subVectors(fingerWorldPos, chakraMesh.position);
      if (toFinger.length() < 1.2) {
        chakraState.active = false;
        chakraState.targetEnemy = null;
      } else {
        toFinger.normalize();
        chakraMesh.position.addScaledVector(toFinger, chakraState.returnSpeed * dt);
      }
    }
  }
  let aliveCount = 0;
  for (const enemy of enemies) {
    if (enemy.alive) {
      enemy.update(dt, playerPos);
      aliveCount++;
    }
  }
  document.getElementById('alive-count').textContent = aliveCount;
  if (aliveCount < 4) spawnEnemies(8);
  camera.position.set(playerPos.x, playerPos.y + 16, playerPos.z + 18);
  camera.lookAt(playerPos.x, playerPos.y + 1.2, playerPos.z);
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
</script>
</body>
</html>
