<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sudarshan Chakra: The Divine Universe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fde68a;font-family:system-ui}#canvas-container{position:fixed;inset:0}#ui-layer{position:fixed;inset:0;z-index:2;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.stats{pointer-events:auto;background:#0a0f1ecc;border:1px solid #d4af3766;border-radius:10px;padding:12px;width:min(290px,70vw);backdrop-filter:blur(8px)}.title{font-weight:800;color:#d4af37;margin-bottom:8px}.bar{height:9px;background:#ffffff22;border-radius:9px;overflow:hidden;margin:4px 0 9px}.fill{height:100%;width:100%;transition:width .15s}.health{background:#10b981}.energy{background:#38bdf8}.label{font-size:11px;color:#cbd5e1;display:flex;justify-content:space-between}.instructions{position:absolute;right:14px;top:14px;background:#0a0f1ecc;border:1px solid #d4af3766;border-radius:8px;padding:10px;font-size:11px;line-height:1.6;color:#cbd5e1}.instructions b{color:#fde68a}.bottom{display:flex;justify-content:space-between;align-items:end}.stick{pointer-events:auto;width:130px;height:130px;border:2px dashed #d4af3788;border-radius:50%;background:#ffffff0d;touch-action:none;position:relative}.knob{position:absolute;left:40px;top:40px;width:46px;height:46px;border-radius:50%;background:radial-gradient(#fde047,#ca8a04);pointer-events:none}.pad{pointer-events:auto;display:grid;grid-template-columns:repeat(2,62px);gap:9px}.pad button{width:62px;height:62px;border-radius:50%;border:2px solid #d4af37;background:#0f172add;color:#fde68a;font-weight:800;font-size:10px;touch-action:manipulation}.pad button:active{background:#d4af37;color:#111}.notice{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#0f172aee;border:1px solid #d4af37;border-radius:20px;padding:8px 16px;opacity:0;transition:opacity .2s;white-space:nowrap}
@media(max-width:600px){.instructions{font-size:9px;padding:7px}.stats{padding:9px}.stick{width:112px;height:112px}.knob{left:33px;top:33px}.pad{grid-template-columns:repeat(2,55px);gap:7px}.pad button{width:55px;height:55px}}
</style></head><body>
<div id="canvas-container"></div><div id="ui-layer">
<div><div class="stats"><div class="title">॥ श्रीकृष्ण : Sudarshan Universe ॥</div><div class="label"><span>DIVINE HEALTH</span><span id="health-txt">500 / 500</span></div><div class="bar"><div id="health-fill" class="fill health"></div></div><div class="label"><span>DIVINE ENERGY</span><span id="energy-txt">200 / 200</span></div><div class="bar"><div id="energy-fill" class="fill energy"></div></div><div class="label"><span>ASURA DEFEATED</span><span id="score">0</span></div></div><div class="instructions"><b>PC CONTROLS</b><br>WASD: Move<br>Mouse drag: Camera<br>F: Throw Chakra<br>R: Recall<br>Space: Dodge<br>Q: Chakra Storm</div></div>
<div class="notice" id="notice"></div><div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="pad"><button id="throw">THROW<br>(F)</button><button id="recall">RECALL<br>(R)</button><button id="dodge">DODGE<br>(SPC)</button><button id="storm">STORM<br>(Q)</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id), scene=new THREE.Scene();scene.background=new THREE.Color(0x070b19);scene.fog=new THREE.FogExp2(0x070b19,.008);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;$('canvas-container').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fcaff,0x302010,1.5));const sun=new THREE.DirectionalLight(0xffe6b5,2);sun.position.set(30,50,20);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x392719,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<45;i++){let h=3+Math.random()*8,m=new THREE.Mesh(new THREE.CylinderGeometry(.5,.9,h,8),new THREE.MeshStandardMaterial({color:0x625143,roughness:.9}));let a=Math.random()*6.28,r=18+Math.random()*115;m.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);m.castShadow=true;scene.add(m)}
const player=new THREE.Group();scene.add(player);const blue=new THREE.MeshStandardMaterial({color:0x2563eb,emissive:0x082f49,emissiveIntensity:.5}),gold=new THREE.MeshStandardMaterial({color:0xfacc15,metalness:.85,roughness:.2}),yellow=new THREE.MeshStandardMaterial({color:0xeab308});
function part(g,m,x,y,z){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;player.add(o);return o}
part(new THREE.CylinderGeometry(.36,.3,1.15,12),blue,0,1.55,0);part(new THREE.CylinderGeometry(.4,.53,1,12),yellow,0,.85,0);part(new THREE.SphereGeometry(.27,16,16),blue,0,2.35,0);part(new THREE.ConeGeometry(.24,.45,10),gold,0,2.72,0);part(new THREE.BoxGeometry(.05,.38,.13),new THREE.MeshStandardMaterial({color:0x06b6d4,emissive:0x059669}),.12,2.95,-.1);
const aura=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16),new THREE.MeshBasicMaterial({color:0x38bdf8,wireframe:true,transparent:true,opacity:.12}));aura.position.y=1.5;player.add(aura);
const chakra=new THREE.Group();scene.add(chakra);chakra.add(new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.09,24),gold));let ring=new THREE.Mesh(new THREE.TorusGeometry(.85,.06,8,48),gold);ring.rotation.x=Math.PI/2;chakra.add(ring);for(let i=0;i<16;i++){let a=i*Math.PI/8,s=new THREE.Mesh(new THREE.ConeGeometry(.1,.4,4),gold);s.position.set(Math.cos(a),0,Math.sin(a));s.rotation.z=-Math.PI/2;s.rotation.y=-a;chakra.add(s)}chakra.add(new THREE.PointLight(0xffc928,2,7));
const enemies=[];let score=0,health=500,energy=200,angle=0,pitch=.18,keys={},joy={x:0,y:0},weapon='DOCKED',origin=new THREE.Vector3(),direction=new THREE.Vector3(),storm=0;let audio;
function sound(freq=440,dur=.25){try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function notify(t){$('notice').textContent=t;$('notice').style.opacity=1;clearTimeout(notify.t);notify.t=setTimeout(()=>$('notice').style.opacity=0,1500)}
function ui(){$('health-txt').textContent=Math.ceil(health)+' / 500';$('energy-txt').textContent=Math.ceil(energy)+' / 200';$('health-fill').style.width=health/5+'%';$('energy-fill').style.width=energy/2+'%';$('score').textContent=score}
class Asura{constructor(x,z,elite=false){this.hp=elite?240:120;this.alive=true;this.speed=elite?4:3;this.mesh=new THREE.Group();let mat=new THREE.MeshStandardMaterial({color:elite?0x9f1239:0x475569});let b=new THREE.Mesh(new THREE.CylinderGeometry(.45,.35,1.35,8),mat);b.position.y=1.2;this.mesh.add(b);let h=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),mat);h.position.y=2.1;this.mesh.add(h);this.mesh.position.set(x,0,z);scene.add(this.mesh)}hit(n){this.hp-=n;this.mesh.position.y=.15;if(this.hp<=0&&this.alive){this.alive=false;scene.remove(this.mesh);score++;energy=Math.min(200,energy+20);ui();notify('Asura defeated! +20 Energy')}setTimeout(()=>{if(this.mesh)this.mesh.position.y=0},80)}update(dt){if(!this.alive)return;let d=this.mesh.position.distanceTo(player.position);if(d<40&&d>1.5){let v=player.position.clone().sub(this.mesh.position).setY(0).normalize();this.mesh.position.addScaledVector(v,this.speed*dt);this.mesh.rotation.y=Math.atan2(v.x,v.z)}else if(d<=1.5){health=Math.max(0,health-18*dt);ui();if(!health)notify('Divine Health depleted!')}}}
for(let i=0;i<14;i++){let a=Math.random()*6.28,r=18+Math.random()*50;enemies.push(new Asura(Math.cos(a)*r,Math.sin(a)*r,Math.random()>.75))}
function hitAll(dmg=60,r=2){enemies.forEach(e=>{if(e.alive&&chakra.position.distanceTo(e.mesh.position)<r)e.hit(dmg)})}
function throwChakra(){if(weapon!=='DOCKED')return;weapon='THROWN';origin.copy(chakra.position);direction.set(0,0,-1).applyAxisAngle(new THREE.Vector3(1,0,0),pitch).applyAxisAngle(new THREE.Vector3(0,1,0),angle);sound(660,.35)}
function recall(){if(weapon!=='DOCKED'){weapon='RECALLING';sound(330,.2)}}
function dodge(){if(energy<25)return;energy-=25;let v=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y);player.position.addScaledVector(v,3.5);ui()}
function doStorm(){if(energy<75){notify('Not enough Divine Energy');return}energy-=75;weapon='STORM';storm=4;ui();sound(220,.7);notify('Divine Chakra Storm!')}
$('throw').onclick=throwChakra;$('recall').onclick=recall;$('dodge').onclick=dodge;$('storm').onclick=doStorm;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyF')throwChakra();if(e.code==='KeyR')recall();if(e.code==='KeyQ')doStorm();if(e.code==='Space')dodge()});addEventListener('keyup',e=>keys[e.code]=false);
let dragging=false,last={x:0,y:0};renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;last={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;angle-=(e.clientX-last.x)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-last.y)*.004,-.2,.7);last={x:e.clientX,y:e.clientY}});
let active=false;const stick=$('stick'),knob=$('knob');stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(active)moveStick(e)});function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.min(43,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*l/43;joy.y=Math.sin(a)*l/43;knob.style.transform='translate('+joy.x*43+'px,'+joy.y*43+'px)'}function reset(){active=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);energy=Math.min(200,energy+dt*5);let x=joy.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),z=joy.y+(keys.KeyS?1:0)-(keys.KeyW?1:0),v=new THREE.Vector3(x,0,z);if(v.lengthSq()>.01){v.normalize();let f=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),angle),r=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),angle);let move=r.multiplyScalar(v.x).add(f.multiplyScalar(-v.z));player.position.addScaledVector(move,8*dt);player.rotation.y=Math.atan2(move.x,move.z)}player.position.clamp(new THREE.Vector3(-140,0,-140),new THREE.Vector3(140,0,140));aura.rotation.y+=dt*.5;
let finger=player.localToWorld(new THREE.Vector3(.55,1.55,0));chakra.rotation.y+=dt*28;
if(weapon==='DOCKED')chakra.position.lerp(finger.clone().add(new THREE.Vector3(0,.4,0)),.3);
if(weapon==='THROWN'){chakra.position.addScaledVector(direction,36*dt);hitAll();if(chakra.position.distanceTo(origin)>45)recall()}
if(weapon==='RECALLING'){let d=finger.clone().sub(chakra.position),n=d.length();if(n<1.2){weapon='DOCKED';notify('Sudarshan Chakra Recalled!')}else{chakra.position.addScaledVector(d.normalize(),44*dt);hitAll()}}
if(weapon==='STORM'){storm-=dt;let a=storm*16;chakra.position.set(player.position.x+Math.cos(a)*6,1.5,player.position.z+Math.sin(a)*6);hitAll(75,2.2);if(storm<=0)recall()}
enemies.forEach(e=>e.update(dt));if(Math.floor(clock.elapsedTime*2)%2===0)ui();
let dist=7.5,off=new THREE.Vector3(Math.sin(angle)*dist*Math.cos(pitch),Math.sin(pitch)*dist+3.2,Math.cos(angle)*dist*Math.cos(pitch));camera.position.copy(player.position).add(off);camera.lookAt(player.position.x,player.position.y+1.6,player.position.z);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui();animate();
})();
</script></body></html>
